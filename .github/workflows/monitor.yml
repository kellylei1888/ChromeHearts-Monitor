name: Chrome Hearts 上新监控

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查官网
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py
      - name: 保存商品快照
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json changes.log 2>/dev/null || git add state.json
          git diff --cached --quiet || git commit -m "更新商品快照" && git push
